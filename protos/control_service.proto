syntax = "proto3";

package syncai_data_bridge;

option go_package = "SyncAI-WebRTC-Worker/internal/pb";

// Velocity command
message Vector3 {
    double x = 1;
    double y = 2;
    double z = 3;
}

message VelocityCommand {
    Vector3 linear = 1;
    Vector3 angular = 2;
    int64 timestamp = 3;
}

message ControlResponse{
    bool success = 1;
    string message = 2;
}

service ControlService{
    rpc StreamVelocity(stream VelocityCommand) returns (ControlResponse);
}