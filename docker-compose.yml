services:
  # Build the c-shared library (libsyncai_worker.so + .h) to ./dist/
  build-lib:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    image: syncai-webrtc-worker-builder
    volumes:
      - ./:/src
      - ./dist:/dist
      - ./scripts:/scripts
    working_dir: /src
    environment:
      - LOCAL_UID=${UID:-1000}
      - LOCAL_GID=${GID:-1000}
    entrypoint: ["/bin/bash", "/scripts/build-lib-entrypoint.sh"]
