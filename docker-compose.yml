services:
  # Runtime image (multi-stage build)
  syncai-webrtc-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: syncai-webrtc-worker
    ports:
      - "18000:18000"

  # Local development: build binary to ./dist/ using host volume
  build-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    image: syncai-webrtc-worker-builder
    volumes:
      - ./:/src
      - ./dist:/dist
      - ./scripts:/scripts
    working_dir: /src
    environment:
      - LOCAL_UID=${UID:-1000}
      - LOCAL_GID=${GID:-1000}
    entrypoint: ["/bin/bash", "/scripts/build-entrypoint.sh"]
