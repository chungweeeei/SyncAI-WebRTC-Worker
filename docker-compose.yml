services:
  build-service:
    build: 
      context: .
      dockerfile: Dockerfile
    image: syncai-webrtc-worker-base
    volumes:
      - ./:/src
      - ./dist:/dist
      - ./scripts:/scripts
    working_dir: /src
    environment:
      - LOCAL_UID=${UID:-1000}
      - LOCAL_GID=${GID:-1000}
    entrypoint: ["/bin/bash", "/scripts/build-entrypoint.sh"]