services:
  webrtc-worker:
    container_name: syncai-webrtc-worker
    image: syncai-webrtc-worker:latest
    ports:
      - "18000:18000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tty: true
    stdin_open: true
    tmpfs:
      - /tmp:size=256M
    devices:
      - /dev/dri:/dev/dri
      - /dev/syncai_camera:/dev/syncai_camera
      - /dev/snd:/dev/snd
    group_add:
      - audio
      - video
    volumes:
      - .:/app
      - /usr/share/alsa:/usr/share/alsa
    command: "/bin/bash"