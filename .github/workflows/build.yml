name: Build

on:
    push:
        branches:
            - main
            - stage
            - dev
        paths-ignore:
            - 'Dockerfile'
            - 'docker-compose.yml'

jobs:
    build:
        runs-on: ubuntu-latest
        container:
            image: ghcr.io/${{ github.repository_owner }}/syncai-webrtc-worker-base:latest
            credentials:
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
        
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set build date
              id: date
              run: echo "BUILD_DATE=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

            - name: Build binary
              run: |
                mkdir -p dist
                go build -o dist/syncai-webrtc-worker cmd/main.go
          
            - name: Smoke test - check port 18000
              run: |
                apt-get update && apt-get install -y netcat-openbsd

                chmod +x dist/syncai-webrtc-worker

                ./dist/syncai-webrtc-worker &
                PID=$!

                sleep 5

                if nc -z localhost 18000; then
                  echo "Port 18000 is open"
                  kill $PID 2>/dev/null || true
                else
                  echo "Port 18000 is not open"
                  kill $PID 2>/dev/null || true
                  exit 1
                fi

            - name: Package binary and service file
              run: |
                cp syncai-webrtc-worker.service dist/
                tar -czf syncai-webrtc-worker-${{ steps.date.outputs.BUILD_DATE }}.tar.gz -C dist .

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                name: syncai-webrtc-worker-${{ steps.date.outputs.BUILD_DATE }}
                path: syncai-webrtc-worker-${{ steps.date.outputs.BUILD_DATE }}.tar.gz
                retention-days: 7