name: Test

on:
    push:
        branches:
            - feat/ci
    pull_request:
        branches:
            - main
            - dev

jobs:
    test:
        runs-on: ubuntu-latest
        container:
            image: ghcr.io/${{ github.repository_owner }}/syncai-webrtc-worker-base:latest
            credentials:
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
        
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: Download dependencies
              run: go mod download
            
            - name: Run go vet
              run: go vet ./...
            
            - name: Run tests
              run: go test -v -race ./...

    
    build:
        runs-on: ubuntu-latest
        needs: test
        container:
            image: ghcr.io/${{ github.repository_owner }}/syncai-webrtc-worker-base:latest
            credentials:
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
        
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set build date
              id: date
              run: echo "BUILD_DATE=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

            - name: Build binary
              run: |
                mkdir -p dist
                go build -o dist/syncai-webrtc-worker cmd/main.go
          
            - name: Smoke test - check port 18000
              run: |
                apt-get update && apt-get install -y netcat-openbsd curl

                BINARY=$(find dist/ -type f -executable | head -n 1)
                chmod +x $BINARY

                $BINARY &
                PID=$!

                sleep 5

                # Use netcat to check if the port is open
                if nc -z localhost 18000; then
                  echo "Port 18000 is open"
                else
                  echo "Port 18000 is not open"
                  kill $PID 2>/dev/null || true
                  exit 1
                fi

                kill $PID 2>/dev/null || true

            - name: Upload binary
              uses: actions/upload-artifact@v4
              with:
                name: syncai-webrtc-worker-${{ steps.date.outputs.BUILD_DATE }}
                path: dist/
                retention-days: 3
