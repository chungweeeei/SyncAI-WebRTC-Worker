name: Test

on:
    push:
        branches:
            - feat/ci
    pull_request:
        branches:
            - main
            - dev

jobs:
    test:
        runs-on: ubuntu-latest
        container:
            image: ghrc.io/${{ github.repository_owner }}/syncai-webrtc-worker-base:latest
            credentials:
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
        
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: Download dependencies
              run: go mod download
            
            - name: Run go vet
              run: go vet ./...
            
            - name: Run tests
              run: go test -v -race -coverprofile=coverage.out ./... | tee test-output.txt

            - name: Generate coverage report
              run: go tool cover -html=coverage.out -o coverage.html

            - name: Upload test results
              uses: actions/upload-artifact@v4
              if: always()
              with:
                name: test-results
                path: |
                  test-output.txt
                  coverage.out
                  coverage.html
                retention-days: 3